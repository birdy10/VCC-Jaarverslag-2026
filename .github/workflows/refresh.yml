# Fetches new results from the KNCB Matchcentre, rebuilds the page and publishes it on GitHub Pages.
# Runs every night, and by hand from the Actions tab ("Run workflow").
name: Refresh data

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Download every scorecard again (picks up corrections to older matches, takes a few minutes)'
        type: boolean
        default: false
      season:
        description: 'Season'
        default: '2026'
  push:
    branches: [main]
    # data/ too, for data fetched locally; the workflow's own data commits don't start a run (GITHUB_TOKEN)
    paths: ['src/**', 'scripts/build.mjs', 'scripts/fetch-data.mjs', 'data/**', '.github/workflows/refresh.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SEASON: ${{ inputs.season || '2026' }}
    steps:
      # The tip of main, not the commit the run was queued for: a run that waited for another one
      # must build on the data that run committed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch results
        if: github.event_name != 'push'
        run: node scripts/fetch-data.mjs "$SEASON" ${{ (inputs.refresh == true || inputs.refresh == 'true') && '--refresh' || '' }}

      - name: Build page
        # The refresh service web app (refresh-service/Code.gs). Its URL is public anyway (it's in the page).
        env:
          REFRESH_URL: https://script.google.com/macros/s/AKfycbwHI6t5WEH5vW26gxlJn7wM7XkL_3tw-imEPQlaYiSgwPtZuC5XhhXypQr93p49yu_f/exec
        run: node scripts/build.mjs "$SEASON" --site "${{ github.server_url }}/${{ github.repository }}/actions/workflows/refresh.yml" --refresh-url "$REFRESH_URL"

      # Keep the data and the scorecard cache in the repo: the next run only downloads new matches
      # and compares with this fetch for the "Data updates" log.
      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data cache
          # Captains' fixes are committed to data/ by the refresh service while a run may be busy: catch up first.
          git diff --cached --quiet || { git commit -m "Data refresh $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
